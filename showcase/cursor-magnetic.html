<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custom Cursor + Magnetic | GSAP Showcase</title>
<link rel="stylesheet" href="../assets/styles.css">
<link rel="stylesheet" href="../assets/showcase.css">
<style>
  .stagepage { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 6vw; gap: 28px; }
  .stagepage h1 { font-size: clamp(2rem, 7vw, 5rem); font-weight: 800; letter-spacing: -0.03em; margin: 0; }
  .stagepage p { color: var(--txt-dim); max-width: 46ch; }
  .row { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
  .mbtn { font-family: var(--sans); font-weight: 700; font-size: 1.05rem; color: #0b0d12; background: var(--accent);
    border: none; border-radius: 999px; padding: 16px 36px; cursor: none; }
  .mbtn.ghost { background: transparent; color: var(--txt); border: 1px solid var(--line); }
  a.link { color: var(--accent-2); font-size: 1.1rem; }

  .cursor-dot, .cursor-ring { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 5000; border-radius: 50%; transform: translate(-50%, -50%); }
  .cursor-dot { width: 8px; height: 8px; background: var(--accent); }
  .cursor-ring { width: 42px; height: 42px; border: 1.5px solid var(--accent); }
  @media (pointer: coarse) { .cursor-dot, .cursor-ring { display: none; } }
</style>
</head>
<body class="no-native">
<div class="sc-bar"><a class="back" href="../index.html">&larr; gallery</a><div class="spacer"></div><span class="tag">gsap.quickTo cursor + magnetic</span></div>

<section class="stagepage">
  <h1>A cursor with a mind.</h1>
  <p>The ring trails your pointer with eased lag, snaps bigger over anything interactive, and the buttons lean toward you.</p>
  <div class="row">
    <button class="mbtn" data-cursor data-magnetic>Primary</button>
    <button class="mbtn ghost" data-cursor data-magnetic>Secondary</button>
  </div>
  <a class="link" href="../index.html" data-cursor>&larr; back to the gallery</a>
</section>

<div class="cursor-ring"></div>
<div class="cursor-dot"></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script>
  // Custom cursor: hide the native one, then move two elements with gsap.quickTo.
  // The dot tracks tightly; the ring lags = a springy trailing feel. quickTo is the
  // cheapest way to make a smooth follower (no tween churn per pointermove).
  const dotX = gsap.quickTo(".cursor-dot", "x", { duration: 0.15, ease: "power3" });
  const dotY = gsap.quickTo(".cursor-dot", "y", { duration: 0.15, ease: "power3" });
  const ringX = gsap.quickTo(".cursor-ring", "x", { duration: 0.5, ease: "power3" });
  const ringY = gsap.quickTo(".cursor-ring", "y", { duration: 0.5, ease: "power3" });

  window.addEventListener("pointermove", (e) => {
    dotX(e.clientX); dotY(e.clientY);
    ringX(e.clientX); ringY(e.clientY);
  });

  // grow the ring over interactive targets
  document.querySelectorAll("[data-cursor]").forEach((el) => {
    el.addEventListener("pointerenter", () => gsap.to(".cursor-ring", { scale: 1.8, borderColor: "#0ae448", duration: 0.3 }));
    el.addEventListener("pointerleave", () => gsap.to(".cursor-ring", { scale: 1, borderColor: "#88ce02", duration: 0.3 }));
  });

  // magnetic buttons: translate toward the cursor while hovering
  document.querySelectorAll("[data-magnetic]").forEach((btn) => {
    const mx = gsap.quickTo(btn, "x", { duration: 0.4, ease: "power3" });
    const my = gsap.quickTo(btn, "y", { duration: 0.4, ease: "power3" });
    btn.addEventListener("pointermove", (e) => {
      const r = btn.getBoundingClientRect();
      mx((e.clientX - (r.left + r.width / 2)) * 0.5);
      my((e.clientY - (r.top + r.height / 2)) * 0.5);
    });
    btn.addEventListener("pointerleave", () => { mx(0); my(0); });
  });
</script>
</body>
</html>
