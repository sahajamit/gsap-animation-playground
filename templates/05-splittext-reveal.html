<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SplitText reveal | GSAP Playground</title>
<link rel="stylesheet" href="../assets/styles.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  .headline { font-size: clamp(1.8rem, 6vw, 3.4rem); font-weight: 800; letter-spacing: -0.02em; text-align: center; line-height: 1.1; }
  .headline .char { display: inline-block; }
  .sub { text-align: center; color: var(--txt-dim); font-size: 1.1rem; margin-top: 18px; }
</style>
</head>
<body>
<header class="demo-head"></header>
<main>
  <div class="wrap">
    <div class="stage">
      <div>
        <div class="headline">Animate text, character by character.</div>
        <div class="sub">Words and lines split cleanly too.</div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
<script src="../assets/demo.js"></script>
<script>
  gsap.registerPlugin(SplitText);

  // SplitText breaks an element into chars / words / lines wrapped in spans,
  // so you can stagger them. It was a paid "Club" plugin until Apr 2025 - now free,
  // rewritten with built-in accessibility (the original text stays in the DOM for screen readers).
  function run() {
    const split = new SplitText(".headline", { type: "chars" });
    gsap.from(split.chars, {
      yPercent: 120,
      opacity: 0,
      rotateX: -90,
      duration: 0.8,
      ease: "back.out(1.7)",
      stagger: { each: 0.025, from: "start" }
    });

    const subSplit = new SplitText(".sub", { type: "words" });
    gsap.from(subSplit.words, { y: 20, opacity: 0, duration: 0.6, ease: "power2.out", stagger: 0.06, delay: 0.5 });
  }
  Demo.init({
    num: "05 / text",
    title: "SplitText: char / word / line reveals",
    blurb: "The go-to for kinetic typography. Split a headline into characters and stagger them in. Once paid, now 100% free. Use type:'words' or 'lines' for different rhythms.",
    plugins: "SplitText (free since Apr 2025)",
    doc: "https://gsap.com/docs/v3/Plugins/SplitText/",
    run: run
  });
</script>
</body>
</html>
