<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MorphSVG | GSAP Playground</title>
<link rel="stylesheet" href="../assets/styles.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  svg { width: 100%; max-width: 320px; height: auto; }
</style>
</head>
<body>
<header class="demo-head"></header>
<main>
  <div class="wrap">
    <div class="stage">
      <svg viewBox="0 0 200 200">
        <!-- the shape we animate -->
        <path id="blob" fill="#88ce02" d="M100,30 C140,30 170,60 170,100 C170,140 140,170 100,170 C60,170 30,140 30,100 C30,60 60,30 100,30 Z"/>
        <!-- hidden target shapes MorphSVG morphs TO -->
        <path id="star" style="display:none" d="M100,20 L120,75 L180,75 L132,110 L150,170 L100,135 L50,170 L68,110 L20,75 L80,75 Z"/>
        <path id="heart" style="display:none" d="M100,170 C30,120 30,60 70,55 C90,52 100,75 100,75 C100,75 110,52 130,55 C170,60 170,120 100,170 Z"/>
      </svg>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/MorphSVGPlugin.min.js"></script>
<script src="../assets/demo.js"></script>
<script>
  gsap.registerPlugin(MorphSVGPlugin);

  // MorphSVG smoothly tweens one SVG path's shape INTO another - even when the
  // two paths have different numbers of points (it auto-matches them).
  // Pass a selector, a path string, or {shape, shapeIndex}. Free since Apr 2025.
  function run() {
    const tl = gsap.timeline({ repeat: -1, defaults: { duration: 1, ease: "power2.inOut" } });
    tl.to("#blob", { morphSVG: "#star", fill: "#0ae448" })
      .to({}, { duration: 0.6 })
      .to("#blob", { morphSVG: "#heart", fill: "#6d5dfc" })
      .to({}, { duration: 0.6 })
      .to("#blob", { morphSVG: "#blob", fill: "#88ce02" }) // back to original
      .to({}, { duration: 0.6 });
  }
  Demo.init({
    num: "12 / svg",
    title: "MorphSVG: tween between shapes",
    blurb: "Morphs one path into another - blob to star to heart - handling mismatched point counts for you. Use it for logo transitions, icon state changes, and organic shape play. Free since Apr 2025.",
    plugins: "MorphSVGPlugin (free since Apr 2025)",
    doc: "https://gsap.com/docs/v3/Plugins/MorphSVGPlugin/",
    run: run
  });
</script>
</body>
</html>
