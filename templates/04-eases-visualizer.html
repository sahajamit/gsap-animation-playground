<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eases visualizer | GSAP Playground</title>
<link rel="stylesheet" href="../assets/styles.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  .ease-list { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 560px; }
  .ease-row { display: grid; grid-template-columns: 130px 1fr; align-items: center; gap: 14px; }
  .ease-row label { font-family: var(--mono); font-size: 0.78rem; color: var(--txt-dim); }
  .ease-track { position: relative; height: 22px; }
  .ball { position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); }
</style>
</head>
<body>
<header class="demo-head"></header>
<main>
  <div class="wrap">
    <div class="stage">
      <div class="ease-list" id="list"></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="../assets/demo.js"></script>
<script>
  const eases = ["none", "power2.out", "power4.inOut", "back.out(1.7)", "elastic.out(1, 0.3)", "bounce.out", "expo.out", "circ.inOut"];
  const list = document.getElementById("list");
  eases.forEach((e) => {
    list.insertAdjacentHTML("beforeend",
      '<div class="ease-row"><label>' + e + '</label><div class="ease-track"><div class="ball" data-ease="' + e + '"></div></div></div>');
  });

  // The ease controls the RATE of change over a tween. Same distance, same
  // duration, totally different feel. This races every built-in ease side by side.
  function run() {
    gsap.utils.toArray(".ball").forEach((ball) => {
      gsap.to(ball, {
        left: "calc(100% - 22px)",
        duration: 2.4,
        ease: ball.dataset.ease,   // each ball uses the ease named in its data attribute
        repeat: -1,
        repeatDelay: 0.4,
        yoyo: true
      });
    });
  }
  Demo.init({
    num: "04 / core",
    title: "Eases: the single biggest lever on 'feel'",
    blurb: "GSAP ships every ease you need for free: power1-4, back, elastic, bounce, expo, circ, sine, plus in/out/inOut variants. Watch the same trip animate with different eases. (CustomEase lets you draw your own — see template 18's family.)",
    plugins: "gsap core only",
    doc: "https://gsap.com/docs/v3/Eases/",
    run: run
  });
</script>
</body>
</html>
