<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DrawSVG | GSAP Playground</title>
<link rel="stylesheet" href="../assets/styles.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  svg { width: 100%; max-width: 460px; height: auto; }
  .stroke { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<header class="demo-head"></header>
<main>
  <div class="wrap">
    <div class="stage">
      <svg viewBox="0 0 400 200">
        <path class="stroke check" d="M40 110 L95 165 L210 45" stroke="#0ae448"/>
        <path class="stroke wave" d="M230 100 Q260 40 290 100 T350 100 T410 100" stroke="#6d5dfc"/>
        <circle class="stroke ring" cx="200" cy="100" r="92" stroke="#88ce02" opacity="0.35"/>
      </svg>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/DrawSVGPlugin.min.js"></script>
<script src="../assets/demo.js"></script>
<script>
  gsap.registerPlugin(DrawSVGPlugin);

  // DrawSVG animates the stroke of any SVG path/line/circle so it looks "drawn".
  // It tweens stroke-dasharray under the hood. Value "0%" = hidden, "100%" = full.
  // Formerly a paid Club plugin - now free.
  function run() {
    const tl = gsap.timeline({ repeat: -1, repeatDelay: 1, defaults: { ease: "power1.inOut" } });
    tl.from(".ring", { drawSVG: "0%", duration: 1.4 })
      .from(".check", { drawSVG: "0%", duration: 0.9 }, "-=0.6")
      .from(".wave", { drawSVG: "0%", duration: 1.0 }, "-=0.3")
      .to({}, { duration: 1 })
      // erase from the other end for a clean loop
      .to(".stroke", { drawSVG: "100% 100%", duration: 0.8, stagger: 0.1 });
  }
  Demo.init({
    num: "11 / svg",
    title: "DrawSVG: animate an SVG being drawn",
    blurb: "Reveals SVG strokes as if drawn by hand - checkmarks, signatures, line icons, underlines. You can also draw partial segments like '20% 80%'. Free since Apr 2025.",
    plugins: "DrawSVGPlugin (free since Apr 2025)",
    doc: "https://gsap.com/docs/v3/Plugins/DrawSVGPlugin/",
    run: run
  });
</script>
</body>
</html>
