<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TextPlugin typewriter | GSAP Playground</title>
<link rel="stylesheet" href="../assets/styles.css">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  .type { font-family: var(--mono); font-size: clamp(1.1rem, 3.5vw, 1.8rem); color: var(--accent-2); min-height: 2.4em; max-width: 40ch; }
  .cursor { display: inline-block; width: 10px; height: 1.1em; background: var(--accent); margin-left: 4px; vertical-align: text-bottom; }
</style>
</head>
<body>
<header class="demo-head"></header>
<main>
  <div class="wrap">
    <div class="stage">
      <div><span class="type"></span><span class="cursor"></span></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/TextPlugin.min.js"></script>
<script src="../assets/demo.js"></script>
<script>
  gsap.registerPlugin(TextPlugin);

  // TextPlugin animates the textContent of an element from one string to another,
  // one character at a time. Pair it with a blinking block for a classic typewriter.
  function run() {
    const lines = [
      "GSAP animates the text itself...",
      "...swapping one string for another,",
      "character by character.",
      "No typing libraries needed."
    ];
    const tl = gsap.timeline({ repeat: -1, repeatDelay: 1 });
    lines.forEach((line) => {
      tl.to(".type", { duration: line.length * 0.04, text: line, ease: "none" })
        .to({}, { duration: 1.2 }); // hold
    });

    // blink the cursor independently
    gsap.to(".cursor", { opacity: 0, duration: 0.5, repeat: -1, yoyo: true, ease: "steps(1)" });
  }
  Demo.init({
    num: "06 / text",
    title: "TextPlugin: typewriter effect",
    blurb: "TextPlugin tweens an element's text content from one string to the next. Drive a sequence of lines on a repeating timeline and blink a cursor beside it for a terminal-style reveal.",
    plugins: "TextPlugin (free)",
    doc: "https://gsap.com/docs/v3/Plugins/TextPlugin/",
    run: run
  });
</script>
</body>
</html>
